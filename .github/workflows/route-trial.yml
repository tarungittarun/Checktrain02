name: Bounded route/source trial
on:
  workflow_dispatch:

jobs:
  route-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe current read-only routes
        run: |
          python3 tools/ci/probe_route_candidates.py | tee route-trial.txt
          cat route-trial.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: route-trial
          path: route-trial.txt
          retention-days: 3
