    steps:
      # A local action is looked up on disk before any of its steps run, so the repo has to be there first:
      # this checkout belongs to the job, not to the action. Without it the job dies with
      # "Can't find 'action.yml' ... Did you forget to run actions/checkout before running your local action?"
      # and no step of the action ever runs - which is what three rows did here.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-row
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          row: ${{ matrix.name }}
          desc: ${{ matrix.desc }}
          api: ${{ matrix.api }}
          img: ${{ matrix.img }}
          abi: ${{ matrix.abi }}
          device: ${{ matrix.device }}
          variant: ${{ matrix.variant || 'debug' }}
          location: ${{ matrix.location || 'denied' }}
          offline: ${{ matrix.offline || false }}
          monkey: ${{ needs.plan.outputs.monkey != '' && needs.plan.outputs.monkey || matrix.monkey }}
          wm_size: ${{ matrix.wm_size || '' }}
          wm_density: ${{ matrix.wm_density || '' }}
          font_scale: ${{ matrix.font_scale || '' }}
          focus: ${{ needs.plan.outputs.focus }}
          group: ${{ matrix.group }}
          boot_timeout: ${{ needs.plan.outputs.boot_timeout }}
  # Release smoke waits for BOTH artifacts, while debug emulators do not wait
  # for R8. Keeping it out of the debug matrix removes the serial shrink delay.
  release_smoke:
    needs: [build, instrument, release_build, plan]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 15
    env:
      API: 34
      IMG: google_apis
      ABI: x86_64
      DEVICE: pixel_6
      ROW: release
      ROW_DESC: R8 + resource-shrunk release APK smoke
      VARIANT: release
      LOCATION: denied
      OFFLINE: false
      MONKEY: ${{ needs.plan.outputs.monkey != '' && needs.plan.outputs.monkey || '0' }}
      GROUP: release
      ROW_BUDGET_MINUTES: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-row
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          row: release
          desc: R8 + resource-shrunk release APK smoke
          api: 34
          img: google_apis
          abi: x86_64
          device: pixel_6
          variant: release
          location: denied
          offline: false
          monkey: ${{ needs.plan.outputs.monkey != '' && needs.plan.outputs.monkey || '0' }}
          focus: ${{ needs.plan.outputs.focus }}
          group: release
          boot_timeout: ${{ needs.plan.outputs.boot_timeout }}

  # ---------------------------------------------------------------------------------------- the summary
  report:
    # `always()` because `e2e_full` is legitimately skipped by a core-only dispatch, and a skipped dependency
    # would otherwise skip this job - which is the job that tells you what was and was not tested.
    needs: [e2e, e2e_full, release_smoke, source_integrity, plan]
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-result-*
          merge-multiple: false
          path: /tmp/rows
      - name: Require source-admission fixtures at the installed APK commit
        env:
          SOURCE_RESULT: ${{ needs.source_integrity.result }}
        run: |
          echo "Source identity/admission fixtures: $SOURCE_RESULT at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SOURCE_RESULT" != success ]; then
            echo "::error::source admission fixtures did not pass; HTTP reachability is not verified ACTUAL"
            exit 1
          fi
      - name: What ran, what did not, and whether that is acceptable
        env:
          E2E_FULL: ${{ needs.plan.outputs.full }}
        run: python3 tools/ci/e2e_rollup.py /tmp/rows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: e2e-classes
          path: /tmp/coverage-classes
      - name: Flow gate with merged coverage from ALL parallel device partitions
        run: |
          set -e
          unzip -qo /tmp/coverage-classes/e2e-classes.zip -d /tmp
          find /tmp/rows -path '*/ec/*.ec' -type f -size +0c -print > /tmp/ec-list
          if [ ! -s /tmp/ec-list ]; then
            echo "::error::no device coverage data from the parallel partitions"; exit 1
          fi
          curl -sSfL --retry 3 --create-dirs -o /tmp/jacoco/org.jacoco.cli-0.8.12-nodeps.jar \
            https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/0.8.12/org.jacoco.cli-0.8.12-nodeps.jar
          mapfile -t ec < /tmp/ec-list
          java -jar /tmp/jacoco/org.jacoco.cli-0.8.12-nodeps.jar merge "${ec[@]}" --destfile /tmp/merged.ec
          bash tools/ci/jacoco_report.sh /tmp/merged.ec /tmp/cls app/src/main/java /tmp/merged-coverage
          python3 tools/ci/flow_coverage.py --jacoco /tmp/merged-coverage/cov.xml --min-lines 45 --summary
      - name: Measure cold workflow wall time against the five-minute target
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "Cold e2e workflow: ${elapsed}s from run creation to report (target <=300s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 300 ]; then
            echo "::warning::five-minute cold-workflow target missed: ${elapsed}s; GitHub queue, build, SDK install and boot are included"
          fi
      - name: Post the roll-up onto the commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### e2e roll-up"
            echo ""
            echo "| row | boot | tests | coverage |"
            echo "| --- | --- | --- | --- |"
            cat /tmp/rows/table.md 2>/dev/null || echo "| (none) | | | |"
            echo ""
            echo "Flows are gated against docs/E2E_FLOWS.md; screenshots and window hierarchies are in the"
            echo "\`e2e-result-*\` artifacts of this run."
            echo ""
            echo "The \`--min-lines\` floor is checked against the first row that produced a JaCoCo report;"
            echo "per-row numbers are in the table above, and they differ because only some rows toggle the"
            echo "radio or drive the release variant."
          } > /tmp/body.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(cat /tmp/body.md)" \
            || echo "::warning::could not post the roll-up"

  # Full sweep only: a single strict report correlates these installed-device
  # partitions with the Android workflow's SAME-SHA APK, unit tests, render
  # assertions, source contracts, signing, release bytes and real durations.
  # It must run even after a red report, because red runs need the root cause most.
  audit:
    needs: [plan, report, e2e, e2e_full, release_smoke]
    if: always() && needs.plan.outputs.full == 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/apk-audit.yml
    with:
      e2e_run_id: ${{ github.run_id }}
    secrets: inherit
