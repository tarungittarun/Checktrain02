# The APK is built here, not on a laptop: this repository is set up so that `git push` is the whole
# build process (no Android SDK, no Gradle, no keystore needed locally).
#
# Three jobs, cheapest first, so a broken push fails in ~30 s instead of 12 minutes:
#   checks  - static consistency checks that need no toolchain (see tools/ci/)
#   build   - JVM unit tests + debug APK, then uploads the APK as an artifact
#   release - only on a tag: R8 release build, optional signing, GitHub Release
name: android
on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kotlin lexical integrity (catches truncated files)
        run: python3 tools/ci/check_kotlin_balance.py app/src
      - name: Cross-file member references
        run: python3 tools/ci/check_refs.py app/src/main/java
      - name: R.* and ViewBinding references
        run: python3 tools/ci/check_resources.py
      - name: ETL importability + schema constant agreement
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build_refdb; print('SCHEMA_VERSION', build_refdb.SCHEMA_VERSION)"
          test "$(python3 -c "import sys; sys.path.insert(0,'tools'); import build_refdb; print(build_refdb.SCHEMA_VERSION)")" \
            = "$(grep -o 'REFDB_SCHEMA_VERSION", "[0-9]*' app/build.gradle | grep -o '[0-9]*')" \
            || { echo "REFDB_SCHEMA_VERSION in app/build.gradle does not match tools/build_refdb.py"; exit 1; }

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # `contents: write` is here for the failure-report step only (a commit comment), so a red build is
    # legible from anywhere; nothing in this job pushes.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The reference timetable DB is a build input (see app/build.gradle's syncRefDb). Building it
      # from the upstream dump takes a few minutes; it is deterministic, so the same commit always
      # produces the same bytes.
      # Verification is part of the ETL run (it rebuilds the expectations from the same dump and
      # compares), so there is no second "verify" step to keep in sync.
      - name: Generate the offline timetable asset
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -f "ETL wall clock: %e s" python3 tools/build_refdb.py \
            --profile halts --out app/src/main/assets/ref/refdb.db.gz 2>&1 | tee /tmp/etl.log
          ls -l app/src/main/assets/ref/ || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests (RailTime calendar maths, search window, wire parsers, position rules)
        shell: bash
        run: set -o pipefail && ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log
      - name: Assemble debug APK
        shell: bash
        run: set -o pipefail && ./gradlew --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee -a /tmp/build.log
      - name: Size report (the ultra-lightweight requirement, measured on every build)
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          {
            echo "### APK size (debug, unsigned)"
            echo
            echo "| file | bytes |"
            echo "| --- | --- |"
            echo "| $apk | $(stat -c %s "$apk") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: opentrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      # The Actions log host is not reachable from every environment that has to debug this build (the
      # agent sandbox that writes most of it, for one). Echoing the failure onto the commit through the
      # REST API — a host that is always reachable — turns "CI is red" into an actual error message,
      # which is the difference between a fix-up round and a guess.
      - name: Report the failure on the commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `|| true` on every filter: a step runs under `set -e`, and a grep that matches nothing
          # would otherwise abort the step that exists to explain the abort. That is exactly how the
          # first version of this step lost the log it was reporting.
          set +e
          {
            echo "### build failed"
            echo
            echo "Tasks that failed:"
            grep -E "^> Task .* FAILED" /tmp/build.log | sed 's/^> /  - /' || echo "  (none — a test or an early step failed)"
            echo
            echo "Failing tests:"
            grep -E "(FAILED|error:$)" /tmp/build.log | grep -v "^> Task" | head -40 || true
            echo
            echo "First 60 Kotlin/Java errors:"
            echo
            echo '```'
            grep "^e: " /tmp/build.log | sed 's|file://[^ ]*/Checktrain02/||' | head -60 || true
            echo '```'
            echo
            echo "What went wrong:"
            echo
            echo '```'
            awk '/\* What went wrong:/,/\* Try:/' /tmp/build.log | head -40 || true
            echo '```'
            if [ -s /tmp/etl.log ]; then
              echo
              echo "<details><summary>etl.log tail</summary>"
              echo
              echo '```'
              tail -c 4000 /tmp/etl.log
              echo
              echo '```'
              echo "</details>"
            fi
          } > /tmp/report.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@/tmp/report.md \
            || echo "::warning::could not post the log comment"


  release:
    # Only for tagged pushes: a release build is the one place R8 and resource shrinking run, so it is
    # deliberately not on every push (it doubles the wall clock for no benefit until a tag is cut).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate the offline timetable asset
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -f "ETL wall clock: %e s" python3 tools/build_refdb.py \
            --profile halts --out app/src/main/assets/ref/refdb.db.gz 2>&1 | tee /tmp/etl.log
          ls -l app/src/main/assets/ref/ || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      # If the repository secrets are configured the build is signed with them; otherwise a transient
      # keystore is generated here so the artifact is still installable for testing. A release that
      # cannot be installed is not useful to anyone, and a signing key never touches the repository.
      - name: Provision a transient signing key when none is configured
        env:
          KS: ${{ secrets.OPENTRACK_KEYSTORE }}
        run: |
          if [ -z "${KS:-}" ]; then
            keytool -genkeypair -v -keystore /tmp/transient.jks -storepass changeme \
              -keypass changeme -alias opentrack -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OpenTrack India, OU=test, O=none, L=NA, S=NA, C=IN"
            echo "OPENTRACK_KEYSTORE=/tmp/transient.jks" >> "$GITHUB_ENV"
            echo "OPENTRACK_KEYSTORE_PASSWORD=changeme" >> "$GITHUB_ENV"
            echo "OPENTRACK_KEY_PASSWORD=changeme" >> "$GITHUB_ENV"
            echo "OPENTRACK_KEY_ALIAS=opentrack" >> "$GITHUB_ENV"
            echo "::notice::built with a transient key - not updatable in place"
          fi
      - name: Assemble release APK (R8 + resource shrinking)
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace
      - name: Publish the APK on the tag
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
