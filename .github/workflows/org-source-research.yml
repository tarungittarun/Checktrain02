# One first-hop GET from a GitHub runner with the app's explicit request contract.
# It is NOT a browser/phone TLS/IP simulator and cannot guarantee phone access.
# Push trigger only when this trial changes, never on ordinary app edits/refresher taps.
name: org-website-request-trial
on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/org-source-research.yml'
      - 'tools/ci/site_request_trial.py'
      - 'tools/ci/test_site_request_trial.py'
  workflow_dispatch:
    inputs:
      train_number:
        description: 'Five-digit train number; one GET only (no retry or challenge handling)'
        type: string
        default: '20689'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline refusal simulations and app-to-runner request-contract gate
        run: |
          python3 tools/ci/test_site_request_trial.py
          python3 tools/ci/site_request_trial.py --contract
      - name: Single bounded runner GET; fail visibly on refusal or non-train page
        env:
          TRAIN_NUMBER: ${{ inputs.train_number || '20689' }}
        shell: bash
        run: |
          set +e
          python3 tools/ci/site_request_trial.py "$TRAIN_NUMBER" > site-request-result.json
          result=$?
          set -e
          {
            echo '### Independent website request trial — GitHub runner, not Android phone'
            echo 'This checks explicit URL/headers and one first-hop GET; no cookies, redirects, retries or challenge automation. HTTP 200 with matching train/cards is **structure only**, not a dated station event or evidence of phone access.'
            echo '```json'
            cat site-request-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Save bounded result even if the website refuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: org-website-request-result
          path: site-request-result.json
          if-no-files-found: warn
          retention-days: 7
