# JVM/Gradle tuning for a small module on a shared CI runner.
# 2 GB is not generosity: R8 over a 5.5 MB asset merge plus Kotlin inline functions in the coroutine
# dependency is what peaks, and an OOM in `assembleRelease` is the kind of failure that reproduces only
# on CI. Two daemons' worth of headroom is still well inside the runner's 7 GB, and the daemon is off
# so nothing lingers.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
