# JVM/Gradle tuning for a small module on a shared CI runner.
# -Xmx1g + no daemon keeps the Android Gradle Plugin inside the 7 GB GitHub runner envelope while
# still avoiding the OOM that R8 + the 5 MB asset merge can otherwise trigger.
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
