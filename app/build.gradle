// OpenTrack India — app module.
//
// Size discipline notes (the "ultra-lightweight" requirement is a hard constraint, so it is encoded
// in the build file rather than left to discipline):
//   * no Compose, no RxJava, no Retrofit/OkHttp, no Glide, no Maps: ~0 MB of transitive weight;
//   * the 5.5 MB SQLite reference asset is the single biggest contributor and it is what makes the
//     app work on a train with no signal, so it earns its place;
//   * `aaptOptions.noCompress` keeps that asset uncompressed *in transit* only if smaller than gz -
//     it is already gzipped, so we let aapt store it as-is and avoid a pointless re-deflate at build.
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "in.opentrack.india"
    compileSdk 34

    defaultConfig {
        applicationId "in.opentrack.india"
        // API 24 (Android 7.0) - covers the practical floor for a 2026 free app while keeping
        // java.time, `SQLiteDatabase.openDatabase` with no prefix, and adaptive icons available
        // without legacy branches.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // No ABI-specific native code at all -> one universal APK, no splits, no app bundle games.
        resConfigs "en"
        buildConfigField "long", "REFDB_SCHEMA_VERSION", "3"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    // Release signing is optional by design. If the keystore env vars are absent we still build a
    // verified-but-unsigned APK rather than failing the pipeline, because the artifact is also used
    // for sideload testing. The CI job re-signs with a transient keystore when no secret is present.
    def releaseKeystore = System.getenv("OPENTRACK_KEYSTORE")?.trim()
    if (releaseKeystore) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("OPENTRACK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("OPENTRACK_KEY_ALIAS") ?: "opentrack"
                keyPassword System.getenv("OPENTRACK_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Debuggable build keeps logs; used by the emulator smoke test in CI.
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    // The reference DB is generated by tools/build_refdb.py. Building it inside Gradle means a
    // fresh clone only needs `./gradlew assembleRelease` - no manual data step to forget.
    // One asset root only. The reference DB lives at src/main/assets/ref/refdb.dbgz, which the ETL
    // (tools/build_refdb.py) writes and syncRefDb regenerates in place when missing. An earlier revision also added
    // build/generated/refdb as a second root so the fallback had somewhere to write, and that made
    // every build with the committed copy fail in mergeDebugAssets with
    // "[ref/refdb.db] … : Error: Duplicate resources" — two roots, one asset name.

    packaging {
        resources {
            excludes += ["META-INF/*.version", "META-INF/*.kotlin_module", "DebugProbesKt.bin",
                         "kotlin/**", ".kotlin_module"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// A CI log that says only "FooTest > bar FAILED" is not a bug report. Full exception text costs
// nothing on a green build and turns a red one into an actionable one — which matters most when the
// runner is the only compiler available (see tools/ci, docs/ARCHITECTURE.md).
tasks.withType(Test).configureEach {
    testLogging {
        events "failed"
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
        showCauses = true
        showStackTraces = false
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    // Everything the UI needs. No Material Components, no ConstraintLayout: the screens are linear
    // lists and stacked text, both of which the plain AppCompat widgets do, and dropping them removes
    // a theme requirement plus ~900 kB of resources from the APK.
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
}

// --------------------------------------------------------------------------- reference DB task

ext {
    // Relative to app/, and deliberately inside src/: it is a committed data asset, so the path the
    // task writes, the path the merger packages and the path README documents are one path.
    refdbAsset = "src/main/assets/ref/refdb.dbgz"
    refdbProfile = (findProperty("refdbProfile") ?: "halts").toString()
    refdbSource = "https://github.com/tarungittarun/Checktrain02/releases/download/refdb-v1/refdb.dbgz"
}

/**
 * Resolve assets/ref/refdb.dbgz:
 *   1. already committed in the working tree            -> use it
 *   2. `python3 tools/build_refdb.py` available         -> build it (deterministic, offline-capable)
 *   3. otherwise                                        -> download the pinned GitHub release
 * Failing all three is a hard error: an APK without the reference DB would silently ship an app
 * that cannot answer "which trains run tomorrow" offline, which is the whole point of this product.
 */
tasks.register("syncRefDb") {
    group = "data"
    description = "Produce app/src/main/assets/ref/refdb.dbgz (committed copy, local ETL, or release download)."
    outputs.file(refdbAsset)
    // Rerun rather than be "up to date" on a file that is also a source file: an asset the developer
    // deleted must come back, and Gradle would otherwise remember producing it.
    outputs.upToDateWhen { false }

    doLast {
        def out = file(refdbAsset)
        if (out.exists() && !project.hasProperty("refdbForce")) {
            logger.lifecycle("refdb: committed asset present (${out.length()} bytes); -PrefdbForce to rebuild")
            return
        }
        out.parentFile.mkdirs()
        def py = ["python3", "python"].find { execQuiet(it) }
        if (py != null) {
            logger.lifecycle("refdb: building with ${py} tools/build_refdb.py")
            exec {
                workingDir rootProject.projectDir
                commandLine py, "tools/build_refdb.py", "--profile", refdbProfile,
                        "--build-dir", "$buildDir/refdb-build", "--out", out.absolutePath
            }
            if (out.exists()) return
        }
        logger.lifecycle("refdb: downloading ${refdbSource}")
        new URL(refdbSource).withInputStream { is -> out.withOutputStream { it << is } }
        if (!out.exists() || out.length() < 1_000_000) {
            out.delete()
            throw new GradleException(
                "refdb.dbgz could not be produced. Run: python3 tools/build_refdb.py")
        }
    }
}

static def execQuiet(String bin) {
    def p = new ProcessBuilder(bin, "--version").redirectErrorStream(true).start()
    p.waitFor()
    p.exitValue() == 0
}

tasks.register("verifyRefDb") {
    group = "verification"
    description = "Assert the bundled reference DB exists, is gzip-framed, and matches the manifest size."
    dependsOn "syncRefDb"
    doLast {
        def f = file(refdbAsset)
        if (!f.exists()) throw new GradleException("missing ${f}")
        def magic = new byte[2]
        f.withInputStream { it.read(magic) }
        if ((magic[0] & 0xff) != 0x1f || (magic[1] & 0xff) != 0x8b) {
            throw new GradleException("${f.name} is not gzip - the asset would be unusable at runtime")
        }
        logger.lifecycle("verifyRefDb: ${f.name} ${f.length()} bytes OK")
    }
}

tasks.named("preBuild") { dependsOn "syncRefDb" }
